name: gateway-hosted-a2a-echo
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
  echo:
    host: azure.ai.agent
    project: src
    language: python
    kind: hosted
    name: gateway-a2a-echo
    uses: [ai-project]
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Gateway acceptance agent returning a completed echo task.
      version: 1.0.0
      skills:
        - id: echo
          name: Echo
          description: Return the incoming text as a completed task artifact.
          tags: [echo]
    env:
      PYTHONNOUSERSITE: '1'
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
