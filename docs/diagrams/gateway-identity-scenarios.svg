<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">APIM and LiteLLM identity scenarios</title>
  <desc id="description">Consumer requests always pass through APIM and LiteLLM. Models use workload identity. Agents and MCP use a shared identity, a dedicated application identity, or user OBO. Administration is a separate private local tunnel. User OBO passed live single-user MCP and hosted/declarative A2A tests after interactive consent; cross-user task isolation remains unverified.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#495057"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000000; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .line { fill: none; stroke: #495057; stroke-width: 2; marker-end: url(#arrow); }
      .private { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#ffffff"/>
  <text x="35" y="42" class="title">APIM exposure + LiteLLM OSS AI gateway</text>
  <text x="35" y="70" class="body">Three separately deployed profiles. Consumer virtual keys and downstream Entra identities are different credentials.</text>

  <rect x="600" y="100" width="805" height="365" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text x="620" y="130" class="heading">AKS: isolated namespaces and key stores per profile</text>
  <rect x="35" y="160" width="225" height="105" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="55" y="190" class="heading">Consumer app / user</text>
  <text x="55" y="219" class="body">Entra bearer token</text>
  <text x="55" y="244" class="body">+ application virtual key</text>
  <rect x="325" y="160" width="220" height="105" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="345" y="190" class="heading">APIM Standard v2</text>
  <text x="345" y="219" class="body">Exposure + JWT checks</text>
  <text x="345" y="244" class="body">Preserves user token</text>
  <path class="line" d="M260 210H325"/>
  <path class="line" d="M545 210H630"/>

  <rect x="630" y="160" width="310" height="105" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="650" y="190" class="heading">LiteLLM OSS</text>
  <text x="650" y="219" class="body">Native virtual-key authorization</text>
  <text x="650" y="244" class="body">Model, MCP and A2A routing</text>
  <rect x="1020" y="160" width="350" height="105" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
  <text x="1040" y="190" class="heading">PostgreSQL + protected Secrets</text>
  <text x="1040" y="219" class="body">Persistent virtual-key state</text>
  <text x="1040" y="244" class="body">Private administrative master key</text>
  <path class="line" d="M940 195H1020"/>

  <rect x="630" y="330" width="310" height="100" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="650" y="360" class="heading">Service-identity MCP adapter</text>
  <text x="650" y="388" class="body">A/B: MCP workload identity</text>
  <text x="650" y="413" class="body">No Foundry agent traffic</text>
  <rect x="1020" y="330" width="350" height="100" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="1040" y="360" class="heading">FastMCP on AKS</text>
  <text x="1040" y="388" class="body">Checks service or delegated identity</text>
  <text x="1040" y="413" class="body">Own workload identity reads Blob</text>
  <path class="line" d="M780 265V330"/>
  <text x="650" y="300" class="small">A/B MCP only</text>
  <path class="line" d="M940 380H1020"/>
  <text x="951" y="367" class="small">A/B</text>
  <path class="line" d="M920 265V290H990V345H1020"/>
  <text x="1005" y="310" class="small">C: native MCP OBO</text>

  <rect x="35" y="345" width="225" height="100" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="55" y="375" class="heading">Private Azure Key Vault</text>
  <text x="55" y="403" class="body">C: OBO app credential</text>
  <text x="55" y="428" class="body">WI + CSI secret delivery</text>
  <path class="line private" d="M260 380H580V230H630"/>
  <text x="310" y="366" class="small">No secret values in YAML / Terraform state</text>

  <rect x="600" y="535" width="805" height="170" rx="14" fill="none" stroke="#5C2D91" stroke-width="2"/>
  <text x="620" y="565" class="heading">Approved Azure Foundry backends</text>
  <rect x="630" y="590" width="220" height="85" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="650" y="621" class="heading">Shared models</text>
  <text x="650" y="651" class="body">A/B/C: workload identity</text>
  <rect x="890" y="590" width="220" height="85" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="910" y="621" class="heading">Hosted agent</text>
  <text x="910" y="651" class="body">Native A2A 1.0</text>
  <rect x="1150" y="590" width="220" height="85" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="1170" y="621" class="heading">Declarative agent</text>
  <text x="1170" y="651" class="body">Published A2A endpoint</text>
  <path class="line" d="M650 265H610V500H740V590"/>
  <text x="620" y="520" class="small">Model inference: gateway workload identity</text>
  <path class="line" d="M900 265H965V480H1000V590"/>
  <path class="line" d="M1000 480H1260V590"/>
  <text x="940" y="506" class="small">Direct Foundry HTTPS | A/B: WI | C: OBO</text>

  <rect x="35" y="545" width="460" height="135" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
  <text x="55" y="576" class="heading">Operator admin UI: private access only</text>
  <text x="55" y="606" class="body">localhost UI bridge + loopback AKS tunnel</text>
  <text x="55" y="633" class="body">Admin key kept in protected local file</text>
  <text x="55" y="660" class="small">Tests LiteLLM directly; not APIM admission or user OBO</text>
  <path class="line private" d="M495 600H565V285H665V265"/>

  <rect x="35" y="755" width="1370" height="205" rx="12" fill="none" stroke="#495057" stroke-width="2"/>
  <text x="55" y="785" class="heading">Profile summary and measured status</text>
  <text x="55" y="823" class="body">A  shared-service</text>
  <text x="360" y="823" class="body">Shared gateway WI for models, agents and MCP</text>
  <text x="1110" y="823" class="body">Azure tests passed</text>
  <text x="55" y="861" class="body">B  dedicated-application</text>
  <text x="360" y="861" class="body">Dedicated gateway WI + isolated key database</text>
  <text x="1110" y="861" class="body">Azure tests passed</text>
  <rect x="45" y="880" width="1350" height="65" rx="7" fill="#DFF6DD" stroke="#107C10"/>
  <text x="55" y="906" class="body">C  user-obo</text>
  <text x="360" y="906" class="body">Models: WI | MCP: native OBO | Agents: custom OBO</text>
  <text x="1110" y="906" class="body">Delegated calls passed</text>
  <text x="55" y="932" class="small">Real consented-user MCP and hosted/declarative A2A verified. Cross-user task isolation remains unverified.</text>
  <text x="35" y="985" class="small">WI = AKS Workload Identity. User identity at MCP ingress does not automatically propagate to Blob or an agent's downstream tools.</text>
</svg>
