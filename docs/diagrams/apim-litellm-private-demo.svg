<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title description">
  <title id="title">Standalone private Foundry demo with LiteLLM</title>
  <desc id="description">Public APIM and LiteLLM call private-only Foundry models and prompt/hosted agents. Both agents expose A2A and Responses. The hosted agent uses its own runtime identity to call private AKS MCP. The MCP hop is HTTP within the VNet, not end-to-end TLS. Private ACR supplies the hosted image. A/B/C authentication remains separate from network isolation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#495057"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000000; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .line { fill: none; stroke: #495057; stroke-width: 2; marker-end: url(#arrow); }
      .config { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1440" height="1030" fill="#ffffff"/>
  <text x="40" y="45" class="title">Standalone demo: public gateway, private Foundry and private MCP</text>
  <text x="40" y="82" class="body">Separate demo lifecycle. No Day 0/platform or team-onboarding integration.</text>
  <rect x="40" y="130" width="240" height="100" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="60" y="165" class="heading">Consumer app / user</text>
  <text x="60" y="200" class="body">Entra JWT + virtual key</text>
  <rect x="340" y="130" width="240" height="100" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="360" y="165" class="heading">APIM Standard v2</text>
  <text x="360" y="200" class="body">Public HTTPS + JWT checks</text>
  <rect x="680" y="130" width="340" height="100" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="700" y="165" class="heading">LiteLLM OSS on AKS</text>
  <text x="700" y="195" class="body">Native keys; fixed backend aliases</text>
  <text x="700" y="218" class="small">APIM uses internal TLS; public test ingress allowed</text>
  <rect x="1100" y="130" width="300" height="100" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="1120" y="165" class="heading">Entra ID + private Key Vault</text>
  <text x="1120" y="200" class="body">WI / user OBO; C secret via CSI</text>
  <path class="line" d="M280 180H340"/>
  <path class="line" d="M580 180H680"/>
  <path class="line config" d="M1020 180H1100"/>

  <rect x="40" y="310" width="1360" height="530" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text x="60" y="342" class="heading">Demo VNet: private backend paths and delegated agent subnet</text>
  <rect x="80" y="390" width="300" height="95" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="100" y="425" class="heading">Foundry private endpoint</text>
  <text x="100" y="460" class="body">Private DNS from AKS and agents</text>
  <path class="line" d="M790 230V275H230V390"/>
  <text x="270" y="266" class="small">Direct HTTPS: models, A2A and Responses</text>
  <path class="line" d="M380 437H450"/>

  <rect x="450" y="365" width="890" height="200" rx="12" fill="none" stroke="#5C2D91" stroke-width="2"/>
  <text x="470" y="398" class="heading">Private Foundry: public network access DISABLED</text>
  <rect x="480" y="430" width="230" height="95" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="500" y="465" class="heading">Prompt agent</text>
  <text x="500" y="500" class="body">A2A + Responses</text>
  <rect x="770" y="430" width="250" height="95" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="790" y="465" class="heading">Hosted model agent</text>
  <text x="790" y="500" class="body">A2A + Responses + MCP read</text>
  <rect x="1080" y="430" width="230" height="95" rx="10" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="1100" y="465" class="heading">Model deployment</text>
  <text x="1100" y="500" class="body">gpt-4o-mini</text>
  <path class="line" d="M1020 477H1080"/>

  <rect x="80" y="670" width="300" height="110" rx="12" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="100" y="705" class="heading">Outbound restriction</text>
  <text x="100" y="738" class="body">NSG denies Internet outbound</text>
  <text x="100" y="766" class="small">Fixed public HTTPS probe blocked</text>
  <rect x="450" y="670" width="230" height="110" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
  <text x="470" y="705" class="heading">Private Premium ACR</text>
  <text x="470" y="740" class="body">Private endpoint image pulls</text>
  <rect x="770" y="670" width="250" height="110" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="790" y="705" class="heading">FastMCP on AKS</text>
  <text x="790" y="738" class="body">Internal LB; Entra authorization</text>
  <text x="790" y="766" class="small">HTTP 8000 inside VNet; no public IP</text>
  <rect x="1090" y="670" width="220" height="110" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
  <text x="1110" y="705" class="heading">Private Blob</text>
  <text x="1110" y="740" class="body">FastMCP read-only WI</text>
  <path class="line" d="M890 525V670"/>
  <text x="905" y="600" class="small">Hosted runtime identity</text>
  <path class="line" d="M850 525V610H565V670"/>
  <text x="485" y="600" class="small">Private image pull</text>
  <path class="line" d="M1020 725H1090"/>
  <path class="line" d="M1020 210H1375V635H1000V670"/>
  <text x="1100" y="620" class="small">Gateway also calls MCP</text>
  <text x="60" y="820" class="small">Published prompt version is model-only. Its experimental native private-MCP binding is not enabled or certified.</text>

  <text x="40" y="890" class="body">A: shared gateway WI. B: dedicated gateway WI/key database. C: user OBO for agent invocation; direct models still use gateway WI.</text>
  <text x="40" y="935" class="body">Hosted internal model/MCP calls use the hosted runtime identity, not automatic user OBO. MCP Blob access uses its server WI.</text>
  <text x="40" y="980" class="body">Measured private model, both agent protocols, hosted MCP read and public HTTPS denial. Private MCP TLS remains production hardening.</text>
</svg>
