name: Onboard Foundry team
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Team configuration name in ci/teams/
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: fsa-${{ vars.FSA_PREFIX }}-release
  cancel-in-progress: false
env:
  FSA_PREFIX: ${{ vars.FSA_PREFIX }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  RUNNER_SSH_PRIVATE_KEY_B64: ${{ secrets.RUNNER_SSH_PRIVATE_KEY_B64 }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -r requirements.txt
      - shell: pwsh
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: ./scripts/Invoke-CIRelease.ps1 -Action team-plan -ProjectName $env:PROJECT_NAME
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: fsa-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -r requirements.txt
      - shell: pwsh
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: ./scripts/Invoke-CIRelease.ps1 -Action team-apply -ProjectName $env:PROJECT_NAME
